name: ethereum-store package tests
on: [push]

env:
  CI: "true"

jobs:
  tests:
    name: ethereum-store package tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - run: npm run test -- --coverage
