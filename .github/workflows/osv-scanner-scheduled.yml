name: OSV-Scanner Scheduled Scan

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main]

permissions:
  # Only read repository contents.
  contents: read
  actions: read

jobs:
  scan-scheduled:
    # Full scan on every push to main and during the weekly scheduled run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ensuro/github-actions/osv-scanner@v3
